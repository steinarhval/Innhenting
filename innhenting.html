<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <title>Avstemning</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="theme.css">
</head>

<body class="collect">
  <div class="collect-wrap">
    <h1 id="title">Avstemning</h1>

    <div id="waitingBox">Vi er straks i gang!</div>

    <!-- MULTI (dynamisk: 2+ valg, inkl SBS/BNR/ABC/YESNO + oppleggsflervalg) -->
    <div id="multiBox" class="hidden">
      <div class="choice-stack" id="multiChoices"></div>
    </div>

    <!-- LIKERT -->
    <div id="likertBox" class="hidden">
      <div class="likert-wrap">
        <div class="likert-scale-label" id="likertScaleLabel">
          Skala
        </div>
        <div class="likert-grid" id="likertGrid"></div>
      </div>
    </div>

    <!-- OPEN-ENDED -->
    <div id="openBox" class="hidden">
      <div class="box-wrap">
        <label for="openText" class="label" id="openLabel">Skriv et kort svar</label>
        <textarea id="openText" rows="4" maxlength="200"></textarea>

        <div class="row">
          <div id="openCount" class="counter">0 / 200</div>
          <button id="openSendBtn" class="btn btn--success btn--compact" onclick="sendOpenAnswer()">
            Send
          </button>
        </div>
      </div>
    </div>

    <!-- WORD CLOUD -->
    <div id="wcBox" class="hidden">
      <div class="box-wrap">
        <div class="label" id="wcLabel">Skriv ord</div>

        <div class="wc-grid">
          <input id="wc1" class="wc-input" type="text" maxlength="20" autocomplete="off" placeholder="Ord 1">
          <input id="wc2" class="wc-input" type="text" maxlength="20" autocomplete="off" placeholder="Ord 2 (valgfritt)">
          <input id="wc3" class="wc-input" type="text" maxlength="20" autocomplete="off" placeholder="Ord 3 (valgfritt)">
          <input id="wc4" class="wc-input hidden" type="text" maxlength="20" autocomplete="off" placeholder="Ord 4 (valgfritt)" aria-hidden="true" disabled>
          <input id="wc5" class="wc-input hidden" type="text" maxlength="20" autocomplete="off" placeholder="Ord 5 (valgfritt)" aria-hidden="true" disabled>
          <input id="wc6" class="wc-input hidden" type="text" maxlength="20" autocomplete="off" placeholder="Ord 6 (valgfritt)" aria-hidden="true" disabled>
          <input id="wc7" class="wc-input hidden" type="text" maxlength="20" autocomplete="off" placeholder="Ord 7 (valgfritt)" aria-hidden="true" disabled>
          <input id="wc8" class="wc-input hidden" type="text" maxlength="20" autocomplete="off" placeholder="Ord 8 (valgfritt)" aria-hidden="true" disabled>
          <input id="wc9" class="wc-input hidden" type="text" maxlength="20" autocomplete="off" placeholder="Ord 9 (valgfritt)" aria-hidden="true" disabled>
          <input id="wc10" class="wc-input hidden" type="text" maxlength="20" autocomplete="off" placeholder="Ord 10 (valgfritt)" aria-hidden="true" disabled>
        </div>

        <div class="row row--end">
          <button id="wcSendBtn" class="btn btn--success btn--compact" onclick="sendWordCloud()">
            Send
          </button>
        </div>

        <div class="hint">
          Tips: Ett ord per felt. Bindestrek er ok. Tall og emojis blir ignorert.
        </div>
      </div>
    </div>

    <div id="msg"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="config.js"></script>

  <script>
    const db = FirebaseUtil.initFirebaseOnce();
    const { stateRef, pollRef, presenceRef } = FirebaseUtil.getRefs(db);

    // -------------------------
    // Client identity + votes
    // -------------------------
    const CLIENT_ID_KEY = "a_plus_b_clientId";
    function getOrCreateClientId() {
      try {
        const existing = localStorage.getItem(CLIENT_ID_KEY);
        if (existing && existing.length >= 8) return existing;
      } catch (_) {}

      let id = null;
      try {
        id = (crypto && typeof crypto.randomUUID === "function") ? crypto.randomUUID() : null;
      } catch (_) {}
      if (!id) id = "cid_" + Math.random().toString(16).slice(2) + "_" + Date.now().toString(16);

      try { localStorage.setItem(CLIENT_ID_KEY, id); } catch (_) {}
      return id;
    }

    const clientId = getOrCreateClientId();
    const votesRef = pollRef.collection("votes");

    function voteDocIdFor(rid, cid) {
      // deterministic, safe for doc-id
      const a = ProgramUtil.toSafeKey(String(rid || "round_0"), "round_0");
      const b = ProgramUtil.toSafeKey(String(cid || "cid"), "cid");
      return a + "__" + b;
    }

    async function checkHasVotedForRound(rid) {
      if (!rid) return false;
      try {
        const vid = voteDocIdFor(rid, clientId);
        const snap = await votesRef.doc(vid).get();
        return !!snap.exists;
      } catch (_) {
        return false;
      }
    }

    let mode = null;
    let round = null;
    let roundId = null;
    let status = "idle";
    let hasVoted = false;

    // resync
    let stateUnsub = null;
    let lastStateUpdateMs = 0;
    let watchdogTimer = null;

    // NY: aktivt spørsmål (kilde til sannhet)
    let activeQuestion = null;

    // DOM refs
    const titleEl = document.getElementById("title");
    const waitingBox = document.getElementById("waitingBox");
    const msgEl = document.getElementById("msg");

    const multiChoices = document.getElementById("multiChoices");

    const likertGrid = document.getElementById("likertGrid");
    const likertScaleLabel = document.getElementById("likertScaleLabel");

    const openText = document.getElementById("openText");
    const openCount = document.getElementById("openCount");
    const openSendBtn = document.getElementById("openSendBtn");
    const openLabel = document.getElementById("openLabel");

    const wcInputs = Array.from({ length: 10 }, (_, i) => document.getElementById("wc" + (i + 1))).filter(Boolean);
    const wcSendBtn = document.getElementById("wcSendBtn");
    const wcLabel = document.getElementById("wcLabel");

    const STOPWORDS = new Set(CONFIG.STOPWORDS_NO);

    // -------------------------
    // Presenter gate (presence)
    // -------------------------
    let presenterAliveFlag = true;
    let lastPresenterMs = 0;

    function presenterOk() {
      const now = Date.now();
      if (!presenterAliveFlag) return false;
      if (!lastPresenterMs) return false;
      return (now - lastPresenterMs) <= CONFIG.PRESENCE.TIMEOUT_MS;
    }

    if (presenceRef) {
      presenceRef.onSnapshot(snap => {
        const d = snap.exists ? snap.data() : {};
        presenterAliveFlag = (d?.alive !== false);
        lastPresenterMs = d?.ts?.toMillis ? d.ts.toMillis() : 0;
        applyPresenterGate();
      });
    }
    setInterval(() => applyPresenterGate(), 1000);

    function applyPresenterGate() {
      const ok = presenterOk();

      if (!ok) {
        hideAll();
        waitingBox.classList.remove("hidden");
        waitingBox.textContent = statusLabel("idle");
        setMsg("");
        setAllInputsDisabled(true);
        setTitle();
        return;
      }

      if (hasVoted) freezeVotedUI(true);
      else freezeVotedUI(false);

      setTitle();
      render();
    }

    // -------------------------
    // Title helper
    // -------------------------
    function statusLabel(st) {
      if (st === "idle") return "IDLE – før start (Vi er straks i gang!)";
      if (st === "collect") return "COLLECT – aktiv innsamling (Svar samles inn!)";
      if (st === "results") return "RESULTS – viser resultater";
      if (st === "paused") return "PAUSED – bytter spørsmål/modus (mellomtilstand)";
      return "";
    }

    function niceModeLabel(m) {
      const map = {
        [CONFIG.MODES.SBS]: "Sunn, bekymringsfull eller skadelig",
        [CONFIG.MODES.BNR]: "Beskyttende, nøytral eller risiko",
        [CONFIG.MODES.ABC]: "A, B eller C",
        [CONFIG.MODES.YESNO]: "JA eller NEI",
        [CONFIG.MODES.MULTI]: "Flervalg",
        [CONFIG.MODES.LIKERT]: "Skala",
        [CONFIG.MODES.OPEN]: "Åpne svar",
        [CONFIG.MODES.WORDCLOUD]: "Ordsky"
      };
      return map[m] || "Avstemning";
    }

    function setTitle() {
      const qt = (activeQuestion?.title || "").toString().trim();
      if (qt) { titleEl.textContent = qt; return; }
      if (mode) titleEl.textContent = niceModeLabel(mode);
      else titleEl.textContent = "Avstemning";
    }

    // -------------------------
    // UI helpers
    // -------------------------
    function setOpenDisabled(disabled) {
      if (openText) openText.disabled = disabled;
      if (openSendBtn) openSendBtn.disabled = disabled;
    }

    function setWcDisabled(disabled) {
      (wcInputs || []).forEach(x => { if (x) x.disabled = disabled; });
      if (wcSendBtn) wcSendBtn.disabled = disabled;
    }

    function setAllInputsDisabled(disabled) {
      // multi
      if (multiChoices) multiChoices.querySelectorAll("button.choice").forEach(b => b.disabled = disabled);

      // likert
      document.querySelectorAll(".likert-btn").forEach(b => b.disabled = disabled);

      // open/wc
      setOpenDisabled(disabled);
      setWcDisabled(disabled);
    }

    function freezeVotedUI(freeze) {
      if (freeze) {
        setAllInputsDisabled(true);
      } else {
        if (!presenterOk()) return;
        setAllInputsDisabled(false);
      }
    }

    function sanitizeWord(raw, maxChars) {
      const s = (raw || "").toLowerCase().trim();
      if (!s) return "";
      let cleaned = s.replace(/[^a-zæøå\-]/g, "");
      cleaned = cleaned.replace(/^\-+|\-+$/g, "");
      if (!cleaned) return "";
      if (STOPWORDS.has(cleaned)) return "";
      const cap = Number.isFinite(maxChars) ? maxChars : CONFIG.LIMITS.WORD_MAX_CHARS;
      if (cleaned.length > cap) cleaned = cleaned.slice(0, cap);
      return cleaned;
    }

    function getMultiOptionsForRender() {
      if (activeQuestion?.options && Array.isArray(activeQuestion.options) && activeQuestion.options.length >= 2) {
        return activeQuestion.options;
      }
      const preset = ProgramUtil.multiPresetForMode(mode);
      if (preset?.options) return preset.options;
      return [
        { id:"a", label:"A", color:"var(--sbs-green)" },
        { id:"b", label:"B", color:"var(--sbs-yellow)" },
        { id:"c", label:"C", color:"var(--sbs-red)" }
      ];
    }

    function rebuildMultiButtons() {
      if (!multiChoices) return;
      const opts = getMultiOptionsForRender();
      multiChoices.innerHTML = "";

      opts.forEach((opt, idx) => {
        const id = (opt?.id || ("o" + idx)).toString();
        const label = (opt?.label ?? ("Valg " + (idx + 1))).toString();

        const btn = document.createElement("button");
        btn.className = "choice";
        btn.textContent = label;

        // farge fra edit (hex eller var(--...))
        if (opt?.color) btn.style.background = opt.color;

        btn.addEventListener("click", () => voteMulti(id));
        multiChoices.appendChild(btn);
      });
    }

    function rebuildLikertButtons() {
      if (!likertGrid) return;
      const qLik = activeQuestion?.likert || null;

      const min = Number.isFinite(qLik?.min) ? qLik.min : 0;
      const max = Number.isFinite(qLik?.max) ? qLik.max : 10;

      likertGrid.innerHTML = "";

      // label over
      if (likertScaleLabel) {
        const left = (qLik?.minLabel || String(min)).toString();
        const right = (qLik?.maxLabel || String(max)).toString();
        likertScaleLabel.textContent = `${min} = ${left}   |   ${max} = ${right}`;
      }

      // bygger knapper fra max til min (som før)
      for (let v = max; v >= min; v--) {
        const btn = document.createElement("button");
        btn.className = "likert-btn";
        btn.textContent = v;
        btn.dataset.value = String(v);
        btn.addEventListener("click", () => voteLikert(v, btn));
        likertGrid.appendChild(btn);
      }
    }

    function applyOpenConfig() {
      const maxChars = Number.isFinite(activeQuestion?.open?.maxChars) ? activeQuestion.open.maxChars : CONFIG.LIMITS.OPEN_MAX_CHARS;

      if (openText) openText.maxLength = maxChars;
      if (openLabel) openLabel.textContent = `Skriv et kort svar (maks ${maxChars} tegn)`;

      if (openCount) openCount.textContent = `0 / ${maxChars}`;
      if (openText) openText.value = "";

      if (openText && openCount) {
        openText.oninput = () => {
          openCount.textContent = (openText.value.length || 0) + " / " + maxChars;
        };
      }
    }

    function applyWcConfig() {
      const maxWords = Number.isFinite(activeQuestion?.wordcloud?.maxWords) ? activeQuestion.wordcloud.maxWords : CONFIG.LIMITS.WORD_MAX_COUNT;
      const maxChars = Number.isFinite(activeQuestion?.wordcloud?.maxCharsPerWord) ? activeQuestion.wordcloud.maxCharsPerWord : CONFIG.LIMITS.WORD_MAX_CHARS;

      if (wcLabel) wcLabel.textContent = `Skriv inntil ${maxWords} ord (maks ${maxChars} tegn per ord)`;

      // Vis/skjul felt etter valgt maxWords (1–10)
      (wcInputs || []).forEach((el, idx) => {
        if (!el) return;
        const n = idx + 1;
        const active = n <= maxWords;

        el.maxLength = maxChars;

        if (!active) {
          el.value = "";
          el.disabled = true;
          el.classList.add("hidden");
          el.setAttribute("aria-hidden", "true");
          return;
        }

        el.disabled = false;
        el.classList.remove("hidden");
        el.removeAttribute("aria-hidden");
        el.value = "";

        el.placeholder = n === 1 ? "Ord 1" : `Ord ${n} (valgfritt)`;
      });
    }

    // -------------------------
    // State listener
    // -------------------------
    attachStateListener();
    setupResync();

    function attachStateListener() {
      if (stateUnsub) { try { stateUnsub(); } catch (_) {} stateUnsub = null; }
      stateUnsub = stateRef.onSnapshot(async (doc) => {
        if (!doc.exists) return;
        const d = doc.data() || {};
        lastStateUpdateMs = Date.now();

        // status + roundId (bakoverkompat)
        roundId = d.roundId ?? (Number.isFinite(d.round) ? ("round_" + d.round) : null);
        const rawStatus = (d.status || "").toString();
        if (rawStatus === "collecting") status = "collect";
        else if (rawStatus === "collect" || rawStatus === "results" || rawStatus === "paused" || rawStatus === "idle") status = rawStatus;
        else status = (d.showResults === true ? "results" : ((d.mode ?? null) ? "collect" : "idle"));

        const newMode = d.mode ?? null;
        const newRound = d.round ?? null;

        // NY
        const newQuestion = d.question || null;

        const changed = (newMode !== mode || newRound !== round);

        mode = newMode;
        round = newRound;
        activeQuestion = newQuestion;

        if (changed) {
          resetUI();
        }

        // Persistert lock: sjekk marker for gjeldende roundId
        const voted = await checkHasVotedForRound(roundId);
        hasVoted = !!voted;

        // Behold “takk”-melding ved re-entry hvis allerede låst
        if (hasVoted) setMsg(CONFIG.TEXT.VOTE_OK);
        else setMsg("");

        setTitle();

        if (presenterOk()) {
          render();
          applyPresenterGate();
        } else {
          applyPresenterGate();
        }
      });
    }

    function forceResync() {
      try { attachStateListener(); } catch (_) {}
      try { stateRef.get(); } catch (_) {}
    }

    function setupResync() {
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) forceResync();
      });

      if (watchdogTimer) clearInterval(watchdogTimer);
      watchdogTimer = setInterval(() => {
        const now = Date.now();
        if (!lastStateUpdateMs) return;
        const threshold = 8000 + Math.floor(Math.random() * 4000); // 8–12 sek
        if ((now - lastStateUpdateMs) > threshold) forceResync();
      }, 1000);
    }

    // -------------------------
    // Render
    // -------------------------
    function render() {
      hideAll();
      setTitle();

      // Presenter gate først
      if (!presenterOk()) {
        waitingBox.classList.remove("hidden");
        waitingBox.textContent = statusLabel("idle");
        setMsg("");
        setAllInputsDisabled(true);
        return;
      }

      // IDLE / PAUSED => ventemodus uten input
      // NB: status === "results" skal IKKE stoppe innsamling på mobil.
      if (!mode || status === "idle" || status === "paused") {
        waitingBox.classList.remove("hidden");
        waitingBox.textContent = statusLabel(status || "idle");
        setAllInputsDisabled(true);
        if (!hasVoted) setMsg("");
        return;
      }

      // COLLECT (og evt RESULTS på storskjerm) => vis riktig input-UI
      waitingBox.classList.add("hidden");
      if (!hasVoted) setMsg("");
      freezeVotedUI(!!hasVoted);

      const isLikert = (mode === CONFIG.MODES.LIKERT);
      const isOpen = (mode === CONFIG.MODES.OPEN);
      const isWc = (mode === CONFIG.MODES.WORDCLOUD);

      const isMulti =
        (mode === CONFIG.MODES.MULTI) ||
        (mode === CONFIG.MODES.SBS) ||
        (mode === CONFIG.MODES.BNR) ||
        (mode === CONFIG.MODES.ABC) ||
        (mode === CONFIG.MODES.YESNO);

      if (isMulti) { show("multiBox"); return; }
      if (isLikert) { show("likertBox"); return; }
      if (isOpen) { show("openBox"); return; }
      if (isWc) { show("wcBox"); return; }

      waitingBox.classList.remove("hidden");
      waitingBox.textContent = statusLabel("idle");
      setAllInputsDisabled(true);
    }

    function resetUI() {
      rebuildMultiButtons();
      rebuildLikertButtons();
      applyOpenConfig();
      applyWcConfig();

      if (presenterOk()) freezeVotedUI(false);
      else applyPresenterGate();
    }

    // -------------------------
    // Actions
    // -------------------------
    async function voteMulti(optionId) {
      if (!presenterOk()) { applyPresenterGate(); return; }
      if (!roundId) return;

      // hard stop hvis marker finnes
      if (hasVoted) return;

      freezeVotedUI(true);

      try {
        const safeId = ProgramUtil.toSafeKey(optionId, "o0");
        const rid = roundId;

        const vid = voteDocIdFor(rid, clientId);
        const vref = votesRef.doc(vid);

        await db.runTransaction(async (tx) => {
          const v = await tx.get(vref);
          if (v.exists) return;

          const fieldPath = `counts.${rid}.${safeId}`;
          tx.set(vref, {
            roundId: rid,
            clientId: clientId,
            ts: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });

          tx.set(pollRef, {}, { merge: true });
          tx.update(pollRef, {
            [fieldPath]: firebase.firestore.FieldValue.increment(1)
          });
        });

        hasVoted = true;
        setMsg(CONFIG.TEXT.VOTE_OK);
        freezeVotedUI(true);

      } catch (err) {
        // re-check marker: hvis den finnes, lås; ellers åpne
        const voted = await checkHasVotedForRound(roundId);
        hasVoted = !!voted;
        if (hasVoted) {
          setMsg(CONFIG.TEXT.VOTE_OK);
          freezeVotedUI(true);
        } else {
          freezeVotedUI(false);
          setMsg(CONFIG.TEXT.TRY_AGAIN);
        }
      }
    }

    async function voteLikert(value, btn) {
      if (!presenterOk()) { applyPresenterGate(); return; }
      if (!roundId) return;
      if (hasVoted) return;

      freezeVotedUI(true);

      try {
        const rid = roundId;

        const vid = voteDocIdFor(rid, clientId);
        const vref = votesRef.doc(vid);

        await db.runTransaction(async (tx) => {
          const v = await tx.get(vref);
          if (v.exists) return;

          tx.set(vref, {
            roundId: rid,
            clientId: clientId,
            ts: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });

          tx.set(pollRef, {}, { merge: true });
          tx.update(pollRef, {
            [`counts.${rid}.likertSum`]: firebase.firestore.FieldValue.increment(value),
            [`counts.${rid}.likertCount`]: firebase.firestore.FieldValue.increment(1)
          });
        });

        hasVoted = true;

        // marker valgt knapp
        document.querySelectorAll(".likert-btn").forEach(b => {
          b.disabled = true;
          b.classList.add("disabled");
          if (b === btn) b.classList.add("selected");
        });

        setMsg(CONFIG.TEXT.VOTE_OK);
        freezeVotedUI(true);

      } catch (err) {
        const voted = await checkHasVotedForRound(roundId);
        hasVoted = !!voted;

        if (hasVoted) {
          setMsg(CONFIG.TEXT.VOTE_OK);
          document.querySelectorAll(".likert-btn").forEach(b => {
            b.disabled = true;
            b.classList.add("disabled");
          });
          if (btn) btn.classList.add("selected");
          freezeVotedUI(true);
        } else {
          document.querySelectorAll(".likert-btn").forEach(b => {
            b.disabled = false;
            b.classList.remove("disabled", "selected");
          });
          freezeVotedUI(false);
          setMsg(CONFIG.TEXT.TRY_AGAIN);
        }
      }
    }

    async function sendOpenAnswer() {
      if (!presenterOk()) { applyPresenterGate(); return; }
      if (!roundId) return;
      if (hasVoted) return;

      const text = (openText?.value || "").trim();
      if (!text) { setMsg(CONFIG.TEXT.WRITE_SOMETHING); return; }

      const maxChars = Number.isFinite(activeQuestion?.open?.maxChars) ? activeQuestion.open.maxChars : CONFIG.LIMITS.OPEN_MAX_CHARS;

      freezeVotedUI(true);

      try {
        const rid = roundId;
        const vid = voteDocIdFor(rid, clientId);
        const vref = votesRef.doc(vid);

        const ansRef = db.collection(CONFIG.FIRESTORE.OPEN_COLLECTION)
          .doc(rid)
          .collection("answers")
          .doc(ProgramUtil.toSafeKey(clientId, "cid"));

        await db.runTransaction(async (tx) => {
          const v = await tx.get(vref);
          if (v.exists) return;

          tx.set(vref, {
            roundId: rid,
            clientId: clientId,
            ts: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });

          tx.set(ansRef, {
            text: text.slice(0, maxChars),
            ts: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });
        });

        hasVoted = true;
        setMsg(CONFIG.TEXT.VOTE_OK);
        freezeVotedUI(true);

      } catch (err) {
        const voted = await checkHasVotedForRound(roundId);
        hasVoted = !!voted;
        if (hasVoted) {
          setMsg(CONFIG.TEXT.VOTE_OK);
          freezeVotedUI(true);
        } else {
          hasVoted = false;
          freezeVotedUI(false);
          setMsg(CONFIG.TEXT.TRY_AGAIN);
        }
      }
    }

    async function sendWordCloud() {
      if (!presenterOk()) { applyPresenterGate(); return; }
      if (!roundId) return;
      if (hasVoted) return;

      const maxWords = Number.isFinite(activeQuestion?.wordcloud?.maxWords) ? activeQuestion.wordcloud.maxWords : CONFIG.LIMITS.WORD_MAX_COUNT;
      const maxChars = Number.isFinite(activeQuestion?.wordcloud?.maxCharsPerWord) ? activeQuestion.wordcloud.maxCharsPerWord : CONFIG.LIMITS.WORD_MAX_CHARS;

      const raw = (wcInputs || []).slice(0, maxWords).map(el => el?.value);
      const w = raw.map(x => sanitizeWord(x, maxChars)).filter(Boolean).slice(0, maxWords);

      if (!w.length) { setMsg(CONFIG.TEXT.WRITE_AT_LEAST_ONE_WORD); return; }

      freezeVotedUI(true);

      try {
        const rid = roundId;
        const vid = voteDocIdFor(rid, clientId);
        const vref = votesRef.doc(vid);

        const ansRef = db.collection(CONFIG.FIRESTORE.WORDCLOUD_COLLECTION)
          .doc(rid)
          .collection("answers")
          .doc(ProgramUtil.toSafeKey(clientId, "cid"));

        await db.runTransaction(async (tx) => {
          const v = await tx.get(vref);
          if (v.exists) return;

          tx.set(vref, {
            roundId: rid,
            clientId: clientId,
            ts: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });

          tx.set(ansRef, {
            words: w,
            ts: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });
        });

        hasVoted = true;
        setMsg(CONFIG.TEXT.VOTE_OK);
        freezeVotedUI(true);

      } catch (err) {
        const voted = await checkHasVotedForRound(roundId);
        hasVoted = !!voted;
        if (hasVoted) {
          setMsg(CONFIG.TEXT.VOTE_OK);
          freezeVotedUI(true);
        } else {
          hasVoted = false;
          freezeVotedUI(false);
          setMsg(CONFIG.TEXT.TRY_AGAIN);
        }
      }
    }

    // -------------------------
    // misc
    // -------------------------
    function hideAll() {
      ["multiBox","likertBox","openBox","wcBox"].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.add("hidden");
      });
      waitingBox.classList.add("hidden");
    }

    function show(id) {
      const el = document.getElementById(id);
      if (el) el.classList.remove("hidden");
    }

    function setMsg(text) {
      msgEl.textContent = text;
    }

    // init
    resetUI();
  </script>
</body>
</html>
