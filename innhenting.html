<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <title>Avstemning</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="theme.css">
</head>

<body class="collect">
  <div class="collect-wrap">
    <h1 id="title">Avstemning</h1>

    <!-- STATUS / WAITING -->
    <div id="waitingBox">Vi er straks i gang!</div>

    <!-- MULTI (dynamisk: 2+ valg, inkl SBS/BNR/ABC/YESNO + oppleggsflervalg) -->
    <div id="multiBox" class="hidden">
      <div class="choice-stack" id="multiChoices"></div>
    </div>

    <!-- LIKERT -->
    <div id="likertBox" class="hidden">
      <div class="likertMobile">
        <div class="likertMobileLabels">
          <span id="likertMinLabel">0</span>
          <span id="likertMaxLabel">10</span>
        </div>

        <input id="likertRange" class="likertRange" type="range" min="0" max="10" step="1" value="0" />
        <div class="likertReadout">
          Valgt: <span id="likertValue">0</span>
        </div>

        <button id="likertSend" class="btn btn--success" type="button">Send</button>
        <div id="likertHint" class="inline-hint" aria-live="polite"></div>
      </div>
    </div>

    <!-- OPEN -->
    <div id="openBox" class="hidden">
      <div class="openMobile">
        <textarea id="openText" class="textarea" rows="5" placeholder="Skriv svaret ditt her…"></textarea>

        <div class="row" style="align-items:center; justify-content:space-between; margin-top:.5rem;">
          <div class="muted">
            <span id="openCount">0</span>/<span id="openMax">150</span>
          </div>
          <button id="openSend" class="btn btn--success" type="button">Send</button>
        </div>

        <div id="openHint" class="inline-hint" aria-live="polite"></div>
      </div>
    </div>

    <!-- WORDCLOUD -->
    <div id="wordcloudBox" class="hidden">
      <div class="wcMobile">
        <div class="muted" style="margin-bottom:.5rem;">
          Skriv <span id="wcMaxWords">3</span> ord (maks <span id="wcMaxChars">20</span> tegn per ord)
        </div>

        <div id="wcInputs" class="wcInputs"></div>

        <button id="wcSend" class="btn btn--success" type="button" style="margin-top:.75rem;">Send</button>
        <div id="wcHint" class="inline-hint" aria-live="polite"></div>
      </div>
    </div>

    <div id="errorBox" class="error" style="display:none;"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="config.js"></script>

  <script>
    // -----------------------------
    // Firebase
    // -----------------------------
    const db = FirebaseUtil.initFirebaseOnce();
    const { stateRef, pollRef, presenceRef } = FirebaseUtil.getRefs(db);

    // -----------------------------
    // DOM
    // -----------------------------
    const titleEl = document.getElementById("title");

    const waitingBox = document.getElementById("waitingBox");

    const multiBox = document.getElementById("multiBox");
    const multiChoices = document.getElementById("multiChoices");

    const likertBox = document.getElementById("likertBox");
    const likertMinLabelEl = document.getElementById("likertMinLabel");
    const likertMaxLabelEl = document.getElementById("likertMaxLabel");
    const likertRange = document.getElementById("likertRange");
    const likertValue = document.getElementById("likertValue");
    const likertSend = document.getElementById("likertSend");
    const likertHint = document.getElementById("likertHint");

    const openBox = document.getElementById("openBox");
    const openText = document.getElementById("openText");
    const openCount = document.getElementById("openCount");
    const openMax = document.getElementById("openMax");
    const openSend = document.getElementById("openSend");
    const openHint = document.getElementById("openHint");

    const wordcloudBox = document.getElementById("wordcloudBox");
    const wcInputs = document.getElementById("wcInputs");
    const wcSend = document.getElementById("wcSend");
    const wcHint = document.getElementById("wcHint");
    const wcMaxWordsEl = document.getElementById("wcMaxWords");
    const wcMaxCharsEl = document.getElementById("wcMaxChars");

    const errorBox = document.getElementById("errorBox");

    // -----------------------------
    // Local vote lock (per device)
    // -----------------------------
    const LS_KEY = "poll_vote_lock_v2";

    function loadLock() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (_) { return {}; }
    }
    function saveLock(obj) {
      try { localStorage.setItem(LS_KEY, JSON.stringify(obj || {})); } catch (_) {}
    }
    function getLockKey(roundId) {
      return String(roundId || "");
    }
    function isLocked(roundId) {
      const lock = loadLock();
      const k = getLockKey(roundId);
      return lock && lock[k] === true;
    }
    function setLocked(roundId, val) {
      const lock = loadLock();
      const k = getLockKey(roundId);
      lock[k] = !!val;
      saveLock(lock);
    }
    function clearAllLocks() {
      saveLock({});
    }

    // -----------------------------
    // State tracking
    // -----------------------------
    let mode = null;
    let status = "idle"; // idle|collect|results|paused
    let round = 0;
    let roundId = null;

    let showResults = false;

    // reset token (fra kjor resetPoll)
    let pollResetToken = 0;
    let lastSeenResetToken = null;

    // question payload (ny kontrakt)
    let q = null;

    // Presence (valgfritt)
    let presenterAlive = null;
    let presenterTsMs = 0;

    // Prevent double-sends (UI)
    let sending = false;

    // -----------------------------
    // Helpers
    // -----------------------------
    function show(id) { const el = document.getElementById(id); if (el) el.classList.remove("hidden"); }
    function hide(id) { const el = document.getElementById(id); if (el) el.classList.add("hidden"); }

    function hideAllModes() {
      hide("multiBox");
      hide("likertBox");
      hide("openBox");
      hide("wordcloudBox");
    }

    function setWaiting(text) {
      waitingBox.textContent = text || CONFIG.TEXT.WAITING_DEFAULT;
      waitingBox.style.display = "block";
    }
    function hideWaiting() {
      waitingBox.style.display = "none";
    }

    function setError(text) {
      if (!text) {
        errorBox.style.display = "none";
        errorBox.textContent = "";
        return;
      }
      errorBox.style.display = "block";
      errorBox.textContent = text;
    }

    function normalizeStatus(s, showResultsFlag, hasMode) {
      const raw = (s || "").toString();
      if (raw === "collecting") return "collect";
      if (raw === "collect") return "collect";
      if (raw === "results") return "results";
      if (raw === "paused") return "paused";
      if (raw === "idle") return "idle";
      return (showResultsFlag ? "results" : (hasMode ? "collect" : "idle"));
    }

    function getTitleFromQuestionOrMode() {
      const t = (q?.title || "").toString().trim();
      if (t) return t;

      const map = {
        [CONFIG.MODES.SBS]: "Trafikklyset",
        [CONFIG.MODES.BNR]: "PROFESOR",
        [CONFIG.MODES.ABC]: "ABC",
        [CONFIG.MODES.YESNO]: "Ja/Nei",
        [CONFIG.MODES.MULTI]: "Flervalg",
        [CONFIG.MODES.LIKERT]: "Skala",
        [CONFIG.MODES.OPEN]: "Fritekst",
        [CONFIG.MODES.WORDCLOUD]: "Ordsky"
      };
      return map[mode] || "Avstemning";
    }

    function setCollectUI(enabled) {
      // Multi
      Array.from(multiChoices.querySelectorAll("button")).forEach(btn => {
        btn.disabled = !enabled;
        btn.classList.toggle("disabled", !enabled);
      });

      // Likert
      likertRange.disabled = !enabled;
      likertSend.disabled = !enabled;

      // Open
      openText.disabled = !enabled;
      openSend.disabled = !enabled;

      // Wordcloud
      Array.from(wcInputs.querySelectorAll("input")).forEach(inp => inp.disabled = !enabled);
      wcSend.disabled = !enabled;
    }

    function showVoteOkIfLocked() {
      if (!roundId) return;
      if (isLocked(roundId)) {
        setWaiting(CONFIG.TEXT.VOTE_OK);
        hideAllModes();
        return true;
      }
      return false;
    }

    function handleResetIfNeeded(nextToken) {
      if (lastSeenResetToken === null) {
        lastSeenResetToken = nextToken;
        return;
      }
      if (Number(nextToken) !== Number(lastSeenResetToken)) {
        // Reset: åpne for ny innsending (for NYTT roundId også, men dette hjelper ved "dobbel reset")
        // Vi sletter ikke historikk for andre runder, men vi låser opp denne aktive runden.
        if (roundId) setLocked(roundId, false);
        sending = false;
        lastSeenResetToken = nextToken;

        // UI refresh
        render();
      }
    }

    function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

    function getMultiOptions() {
      // Ny kontrakt: q.options ved multi
      if (q?.options && Array.isArray(q.options) && q.options.length >= 2) return q.options;

      // Legacy preset hvis mode er sbs/bnr/abc/yesno
      const preset = ProgramUtil.multiPresetForMode(mode);
      if (preset?.options) return preset.options;

      // fallback
      return [
        { id:"a", label:"A", color:"var(--sbs-green)" },
        { id:"b", label:"B", color:"var(--sbs-yellow)" },
        { id:"c", label:"C", color:"var(--sbs-red)" }
      ];
    }

    function applyButtonColor(btn, color) {
      // Vi bruker kun inline hvis farge er gitt som CSS-var eller null.
      // (Du kan senere flytte dette helt til theme.css om du vil.)
      if (color) btn.style.background = color;
      else btn.style.background = "";
    }

    // -----------------------------
    // Render
    // -----------------------------
    function render() {
      setError(null);

      titleEl.textContent = getTitleFromQuestionOrMode();

      // Hvis foreleser ikke er "alive" (valgfritt signal), la oss være konservative:
      // Vis "vi er straks i gang" når status=idle.
      if (!mode || status === "idle") {
        hideAllModes();
        setWaiting(CONFIG.TEXT.WAITING_DEFAULT);
        return;
      }

      // I paused og results: vi skal ikke ta imot svar
      if (status === "paused") {
        hideAllModes();
        setWaiting("Venter…");
        return;
      }

      if (status === "results" || showResults === true) {
        hideAllModes();
        setWaiting("Resultater vises");
        return;
      }

      // status === collect:
      // dersom låst => vis "takk" og skjul alt
      if (showVoteOkIfLocked()) return;

      // Ellers: vis riktig UI og aktiver
      hideWaiting();
      hideAllModes();

      if (mode === CONFIG.MODES.LIKERT) {
        show("likertBox");
        renderLikertUI();
        setCollectUI(true);
        return;
      }

      if (mode === CONFIG.MODES.OPEN) {
        show("openBox");
        renderOpenUI();
        setCollectUI(true);
        return;
      }

      if (mode === CONFIG.MODES.WORDCLOUD) {
        show("wordcloudBox");
        renderWordcloudUI();
        setCollectUI(true);
        return;
      }

      // Multi: multi eller legacy sbs/bnr/abc/yesno
      if (
        mode === CONFIG.MODES.MULTI ||
        mode === CONFIG.MODES.SBS ||
        mode === CONFIG.MODES.BNR ||
        mode === CONFIG.MODES.ABC ||
        mode === CONFIG.MODES.YESNO
      ) {
        show("multiBox");
        renderMultiUI();
        setCollectUI(true);
        return;
      }

      // fallback
      hideAllModes();
      setWaiting(CONFIG.TEXT.WAITING_DEFAULT);
    }

    function renderMultiUI() {
      const options = getMultiOptions();
      multiChoices.innerHTML = "";

      options.forEach((opt, idx) => {
        const id = (opt?.id || ("o" + idx)).toString();
        const label = (opt?.label ?? ("Valg " + (idx + 1))).toString();

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "btn btn--choice";
        btn.textContent = label;

        applyButtonColor(btn, opt?.color || null);

        btn.addEventListener("click", () => sendMultiVote(id));
        multiChoices.appendChild(btn);
      });
    }

    function renderLikertUI() {
      const qLik = q?.likert || null;
      const min = Number.isFinite(qLik?.min) ? qLik.min : 0;
      const max = Number.isFinite(qLik?.max) ? qLik.max : 10;

      likertRange.min = String(min);
      likertRange.max = String(max);

      // Hvis range ligger utenfor (ved nytt spm), clamp
      const current = Number(likertRange.value || min);
      const next = clamp(current, min, max);
      likertRange.value = String(next);
      likertValue.textContent = String(next);

      // labels
      const minLabel = (qLik?.minLabel ?? String(min)).toString();
      const maxLabel = (qLik?.maxLabel ?? String(max)).toString();
      likertMinLabelEl.textContent = minLabel;
      likertMaxLabelEl.textContent = maxLabel;

      likertHint.textContent = "";
    }

    function renderOpenUI() {
      const maxChars = Number.isFinite(q?.open?.maxChars) ? q.open.maxChars : CONFIG.LIMITS.OPEN_MAX_CHARS_DEFAULT;
      openMax.textContent = String(maxChars);

      const txt = openText.value || "";
      openCount.textContent = String(txt.length);

      openHint.textContent = "";
    }

    function renderWordcloudUI() {
      const maxWords = Number.isFinite(q?.wordcloud?.maxWords) ? q.wordcloud.maxWords : CONFIG.LIMITS.WORD_MAX_COUNT_DEFAULT;
      const maxChars = Number.isFinite(q?.wordcloud?.maxCharsPerWord) ? q.wordcloud.maxCharsPerWord : CONFIG.LIMITS.WORD_MAX_CHARS_DEFAULT;

      wcMaxWordsEl.textContent = String(maxWords);
      wcMaxCharsEl.textContent = String(maxChars);

      // rebuild inputs every time mode/round changes
      if (wcInputs.childElementCount !== maxWords) {
        wcInputs.innerHTML = "";
        for (let i = 0; i < maxWords; i++) {
          const inp = document.createElement("input");
          inp.type = "text";
          inp.className = "input";
          inp.maxLength = maxChars;
          inp.placeholder = "Ord " + (i + 1);
          inp.autocomplete = "off";
          inp.addEventListener("input", () => {
            // ingen fancy her, men du kan live-validate om du vil
          });
          wcInputs.appendChild(inp);
        }
      }

      wcHint.textContent = "";
    }

    // -----------------------------
    // Sending
    // -----------------------------
    async function sendMultiVote(optionId) {
      if (!roundId || !mode) return;
      if (sending) return;
      if (isLocked(roundId)) return;

      sending = true;
      setCollectUI(false);
      setError(null);

      try {
        const rid = String(roundId);

        await db.runTransaction(async (tx) => {
          const stateSnap = await tx.get(stateRef);
          const sd = stateSnap.exists ? (stateSnap.data() || {}) : {};
          const liveRoundId = String(sd.roundId || ("round_" + (sd.round || 0)));

          // hvis vi har "hoppet" siden klikket, ikke skriv feil sted
          if (liveRoundId !== rid) throw new Error("Runden har endret seg. Prøv igjen.");

          // per-round counts
          tx.set(pollRef, {
            counts: {
              [rid]: {
                [optionId]: firebase.firestore.FieldValue.increment(1)
              }
            }
          }, { merge: true });

          // legacy flat fields (for gamle klienter)
          if (optionId === "a") tx.set(pollRef, { A: firebase.firestore.FieldValue.increment(1) }, { merge: true });
          if (optionId === "b") tx.set(pollRef, { B: firebase.firestore.FieldValue.increment(1) }, { merge: true });
          if (optionId === "c") tx.set(pollRef, { C: firebase.firestore.FieldValue.increment(1) }, { merge: true });
        });

        setLocked(roundId, true);
        hideAllModes();
        setWaiting(CONFIG.TEXT.VOTE_OK);

      } catch (err) {
        setError((err && err.message) ? err.message : CONFIG.TEXT.TRY_AGAIN);
        setCollectUI(true);
      } finally {
        sending = false;
      }
    }

    async function sendLikert() {
      if (!roundId || !mode) return;
      if (sending) return;
      if (isLocked(roundId)) return;

      const v = Number(likertRange.value);
      if (!Number.isFinite(v)) return;

      sending = true;
      setCollectUI(false);
      setError(null);
      likertHint.textContent = "";

      try {
        const rid = String(roundId);

        await db.runTransaction(async (tx) => {
          const stateSnap = await tx.get(stateRef);
          const sd = stateSnap.exists ? (stateSnap.data() || {}) : {};
          const liveRoundId = String(sd.roundId || ("round_" + (sd.round || 0)));

          if (liveRoundId !== rid) throw new Error("Runden har endret seg. Prøv igjen.");

          // per-round likert bucket
          tx.set(pollRef, {
            counts: {
              [rid]: {
                likertSum: firebase.firestore.FieldValue.increment(v),
                likertCount: firebase.firestore.FieldValue.increment(1)
              }
            }
          }, { merge: true });

          // legacy
          tx.set(pollRef, {
            likertSum: firebase.firestore.FieldValue.increment(v),
            likertCount: firebase.firestore.FieldValue.increment(1)
          }, { merge: true });
        });

        setLocked(roundId, true);
        hideAllModes();
        setWaiting(CONFIG.TEXT.VOTE_OK);

      } catch (err) {
        setError((err && err.message) ? err.message : CONFIG.TEXT.TRY_AGAIN);
        setCollectUI(true);
      } finally {
        sending = false;
      }
    }

    async function sendOpen() {
      if (!roundId || !mode) return;
      if (sending) return;
      if (isLocked(roundId)) return;

      const txt = (openText.value || "").trim();
      const maxChars = Number.isFinite(q?.open?.maxChars) ? q.open.maxChars : CONFIG.LIMITS.OPEN_MAX_CHARS_DEFAULT;

      if (!txt) {
        openHint.textContent = CONFIG.TEXT.WRITE_SOMETHING;
        return;
      }
      if (txt.length > maxChars) {
        openHint.textContent = "For langt svar. Maks " + maxChars + " tegn.";
        return;
      }

      sending = true;
      setCollectUI(false);
      setError(null);
      openHint.textContent = "";

      try {
        const rid = String(roundId);

        await db.runTransaction(async (tx) => {
          const stateSnap = await tx.get(stateRef);
          const sd = stateSnap.exists ? (stateSnap.data() || {}) : {};
          const liveRoundId = String(sd.roundId || ("round_" + (sd.round || 0)));

          if (liveRoundId !== rid) throw new Error("Runden har endret seg. Prøv igjen.");

          const ref = db.collection(CONFIG.FIRESTORE.OPEN_COLLECTION)
            .doc(rid)
            .collection("answers")
            .doc();

          tx.set(ref, {
            text: txt,
            ts: firebase.firestore.FieldValue.serverTimestamp()
          });
        });

        setLocked(roundId, true);
        hideAllModes();
        setWaiting(CONFIG.TEXT.VOTE_OK);

      } catch (err) {
        setError((err && err.message) ? err.message : CONFIG.TEXT.TRY_AGAIN);
        setCollectUI(true);
      } finally {
        sending = false;
      }
    }

    function cleanWord(w, maxChars) {
      const s = (w || "").toString().trim();
      if (!s) return "";
      // maks lengde + “snille” tegn
      const cut = s.slice(0, maxChars);
      // fjern bare helt stygge tegn (behold æøå)
      return cut.replace(/[^\p{L}\p{N}\- _]/gu, "").trim();
    }

    function isStopwordNo(w) {
      const k = (w || "").toString().trim().toLowerCase();
      if (!k) return true;
      return CONFIG.STOPWORDS_NO.includes(k);
    }

    async function sendWordcloud() {
      if (!roundId || !mode) return;
      if (sending) return;
      if (isLocked(roundId)) return;

      const maxWords = Number.isFinite(q?.wordcloud?.maxWords) ? q.wordcloud.maxWords : CONFIG.LIMITS.WORD_MAX_COUNT_DEFAULT;
      const maxChars = Number.isFinite(q?.wordcloud?.maxCharsPerWord) ? q.wordcloud.maxCharsPerWord : CONFIG.LIMITS.WORD_MAX_CHARS_DEFAULT;

      const inputs = Array.from(wcInputs.querySelectorAll("input"));
      const raw = inputs.slice(0, maxWords).map(i => i.value);

      const words = raw
        .map(w => cleanWord(w, maxChars))
        .map(w => w.trim())
        .filter(Boolean);

      const dedup = [];
      const seen = new Set();
      for (const w of words) {
        const key = w.toLowerCase();
        if (!key) continue;
        if (seen.has(key)) continue;
        seen.add(key);
        dedup.push(w);
      }

      const filtered = dedup.filter(w => !isStopwordNo(w));

      if (!filtered.length) {
        wcHint.textContent = CONFIG.TEXT.WRITE_AT_LEAST_ONE_WORD;
        return;
      }

      sending = true;
      setCollectUI(false);
      setError(null);
      wcHint.textContent = "";

      try {
        const rid = String(roundId);

        await db.runTransaction(async (tx) => {
          const stateSnap = await tx.get(stateRef);
          const sd = stateSnap.exists ? (stateSnap.data() || {}) : {};
          const liveRoundId = String(sd.roundId || ("round_" + (sd.round || 0)));

          if (liveRoundId !== rid) throw new Error("Runden har endret seg. Prøv igjen.");

          const ref = db.collection(CONFIG.FIRESTORE.WORDCLOUD_COLLECTION)
            .doc(rid)
            .collection("answers")
            .doc();

          tx.set(ref, {
            words: filtered,
            ts: firebase.firestore.FieldValue.serverTimestamp()
          });
        });

        setLocked(roundId, true);
        hideAllModes();
        setWaiting(CONFIG.TEXT.VOTE_OK);

      } catch (err) {
        setError((err && err.message) ? err.message : CONFIG.TEXT.TRY_AGAIN);
        setCollectUI(true);
      } finally {
        sending = false;
      }
    }

    // -----------------------------
    // Events
    // -----------------------------
    likertRange.addEventListener("input", () => {
      likertValue.textContent = String(likertRange.value);
    });

    likertSend.addEventListener("click", () => sendLikert());

    openText.addEventListener("input", () => {
      const maxChars = Number.isFinite(q?.open?.maxChars) ? q.open.maxChars : CONFIG.LIMITS.OPEN_MAX_CHARS_DEFAULT;
      const txt = openText.value || "";
      if (txt.length > maxChars) {
        openText.value = txt.slice(0, maxChars);
      }
      openCount.textContent = String(openText.value.length);
    });

    openSend.addEventListener("click", () => sendOpen());

    wcSend.addEventListener("click", () => sendWordcloud());

    // enter-to-send i wordcloud: enter på siste input -> send
    document.addEventListener("keydown", (e) => {
      if (status !== "collect") return;
      if (!mode) return;

      if (e.key === "Enter") {
        const tag = document.activeElement?.tagName?.toLowerCase();
        if (mode === CONFIG.MODES.OPEN && tag === "textarea") return; // ikke send open på enter
        if (mode === CONFIG.MODES.WORDCLOUD && tag === "input") {
          // hvis siste input har fokus -> send
          const inputs = Array.from(wcInputs.querySelectorAll("input"));
          if (inputs.length && document.activeElement === inputs[inputs.length - 1]) {
            e.preventDefault();
            sendWordcloud();
            return;
          }
        }
        if (mode === CONFIG.MODES.LIKERT && tag !== "textarea") {
          // enter kan sende likert
          e.preventDefault();
          sendLikert();
          return;
        }
      }
    });

    // -----------------------------
    // Firestore listeners
    // -----------------------------
    // Presence (valgfritt)
    presenceRef.onSnapshot(doc => {
      const d = doc.exists ? (doc.data() || {}) : {};
      presenterAlive = d.alive === true;
      presenterTsMs = d.ts?.toDate ? d.ts.toDate().getTime() : 0;
      // vi styrer ikke UI hardt av dette, men kan bruke det til hint senere
    });

    // State
    stateRef.onSnapshot(doc => {
      if (!doc.exists) return;
      const d = doc.data() || {};

      mode = d.mode ?? null;
      showResults = d.showResults === true;

      round = Number.isFinite(d.round) ? d.round : 0;
      roundId = (d.roundId || ("round_" + round)).toString();

      pollResetToken = Number.isFinite(d.pollResetToken) ? d.pollResetToken : 0;
      handleResetIfNeeded(pollResetToken);

      status = normalizeStatus(d.status, showResults, !!mode);

      // Ny kontrakt
      q = d.question || null;

      // Fallback: dersom vi er i legacy enkelmodus og question mangler,
      // lag en "virtuel" question for konsistente labels.
      if (!q && mode) {
        const preset = ProgramUtil.multiPresetForMode(mode);
        if (preset) {
          q = ProgramUtil.questionToStatePayload(preset);
        } else {
          // minimal for likert/open/wordcloud (tilfelle: manual startQuick)
          if (mode === CONFIG.MODES.LIKERT) q = { title: "Skala", mode:"likert", likert:{ min:0, max:10, minLabel:"0", maxLabel:"10", spread:false } };
          if (mode === CONFIG.MODES.OPEN) q = { title: "Fritekst", mode:"open", open:{ maxChars: CONFIG.LIMITS.OPEN_MAX_CHARS_DEFAULT } };
          if (mode === CONFIG.MODES.WORDCLOUD) q = { title: "Ordsky", mode:"wordcloud", wordcloud:{ maxWords: CONFIG.LIMITS.WORD_MAX_COUNT_DEFAULT, maxCharsPerWord: CONFIG.LIMITS.WORD_MAX_CHARS_DEFAULT } };
          if (mode === CONFIG.MODES.MULTI) q = { title: "Flervalg", mode:"multi", options: getMultiOptions() };
        }
      }

      // Når vi kommer inn i en NY runde:
      // - ikke lås opp gamle runder
      // - men oppdater UI umiddelbart
      render();
    });

    // -----------------------------
    // Init: start i waiting
    // -----------------------------
    hideAllModes();
    setWaiting(CONFIG.TEXT.WAITING_DEFAULT);
    setCollectUI(false);
  </script>
</body>
</html>
