<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <title>Avstemning</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="theme.css">
</head>

<body class="collect">
  <div class="collect-wrap">
    <h1 id="title">Avstemning</h1>

    <div id="waitingBox">Vi er straks i gang!</div>

    <!-- MULTI (dynamisk: 2+ valg, inkl SBS/BNR/ABC/YESNO + oppleggsflervalg) -->
    <div id="multiBox" class="hidden">
      <div class="choice-stack" id="multiChoices"></div>
    </div>

    <!-- LIKERT -->
    <div id="likertBox" class="hidden">
      <div class="box-wrap">
        <div class="likert-wrap">
          <div class="likert-scale-label" id="likertScaleLabel">
            Skala
          </div>
          <div class="likert-grid" id="likertGrid"></div>
        </div>
      </div>
    </div>

    <!-- OPEN-ENDED -->
    <div id="openBox" class="hidden">
      <div class="box-wrap">
        <label for="openText" class="label" id="openLabel">Skriv et kort svar</label>
        <textarea id="openText" rows="4" class="textarea" placeholder=""></textarea>
        <div class="row between" style="margin-top:.6rem;">
          <div class="muted" id="openCounter"></div>
          <button class="btn btn--success" id="openSendBtn" onclick="sendOpen()">Send</button>
        </div>
      </div>
    </div>

    <!-- WORDCLOUD -->
    <div id="wcBox" class="hidden">
      <div class="box-wrap">
        <div class="label" id="wcLabel">Skriv inntil 3 ord</div>
        <div id="wcInputs" class="wcInputs"></div>
        <button class="btn btn--success" style="margin-top:.6rem;" onclick="sendWordcloud()">Send</button>
      </div>
    </div>

    <div id="msg" class="msg hidden"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="config.js"></script>

  <script>
    const db = FirebaseUtil.initFirebaseOnce();
    const { stateRef, pollRef, presenceRef } = FirebaseUtil.getRefs(db);

    let mode = null;
    let round = null;
    let roundId = null;
    let status = "idle";
    let hasVoted = false;

    // resync / reconnect
    let stateUnsub = null;
    let lastStateUpdateMs = 0;

    // NY: aktivt spørsmål (kilde til sannhet)
    let activeQuestion = null;

    // DOM refs
    const titleEl = document.getElementById("title");
    const waitingBox = document.getElementById("waitingBox");
    const msgEl = document.getElementById("msg");

    // boxes
    const multiBox = document.getElementById("multiBox");
    const likertBox = document.getElementById("likertBox");
    const openBox = document.getElementById("openBox");
    const wcBox = document.getElementById("wcBox");

    // multi
    const multiChoices = document.getElementById("multiChoices");

    // likert
    const likertGrid = document.getElementById("likertGrid");
    const likertScaleLabel = document.getElementById("likertScaleLabel");

    // open
    const openText = document.getElementById("openText");
    const openCounter = document.getElementById("openCounter");
    const openLabel = document.getElementById("openLabel");
    const openSendBtn = document.getElementById("openSendBtn");

    // wordcloud
    const wcInputs = document.getElementById("wcInputs");
    const wcLabel = document.getElementById("wcLabel");

    function setMsg(t) {
      msgEl.textContent = (t || "");
      msgEl.classList.toggle("hidden", !msgEl.textContent);
    }

    function hideAll() {
      multiBox.classList.add("hidden");
      likertBox.classList.add("hidden");
      openBox.classList.add("hidden");
      wcBox.classList.add("hidden");
    }

    function resetUI() {
      setMsg("");
      if (openText) openText.value = "";
      if (wcInputs) wcInputs.innerHTML = "";
    }

    function setTitle() {
      const q = activeQuestion;
      const t = q?.title || q?.questionTitle || null;
      titleEl.textContent = t ? t : "Avstemning";
    }

    function presenterOk() {
      // “presenter heartbeat” – hvis foreleser ikke er aktiv: gate
      const last = FirebaseUtil.getPresenterLastSeenMs();
      const maxAge = CONFIG?.PRESENCE?.MAX_AGE_MS || 8000;
      if (!last) return false;
      return (Date.now() - last) <= maxAge;
    }

    function applyPresenterGate() {
      // behold eksisterende (ikke endre svarflyt her)
    }

    function renderDynamicMulti() {
      const q = activeQuestion;
      const opts = Array.isArray(q?.options) ? q.options : [];

      if (!opts.length) {
        multiChoices.innerHTML = "";
        return;
      }

      multiChoices.innerHTML = opts.map(o => {
        const id = (o && o.id) ? String(o.id) : "";
        const label = (o && o.label) ? String(o.label) : id;
        const color = (o && o.color) ? String(o.color) : "";

        const safeLabel = escapeHtml(label || id);
        const safeId = escapeAttr(id);

        return `<button class="choice" style="${color ? ("background:" + escapeAttr(color) + ";") : ""}" onclick="voteDynamic('${safeId}')">${safeLabel}</button>`;
      }).join("");
    }

    function buildLikertGrid() {
      // bygger knapper for likert (behold eksisterende enkelhet)
      const q = activeQuestion || {};
      const min = Number.isFinite(Number(q.likertMin)) ? Number(q.likertMin) : 0;
      const max = Number.isFinite(Number(q.likertMax)) ? Number(q.likertMax) : 10;

      const minLabel = q.likertMinLabel || "";
      const maxLabel = q.likertMaxLabel || "";

      if (likertScaleLabel) {
        likertScaleLabel.textContent = (minLabel || maxLabel) ? `${minLabel} – ${maxLabel}` : "Skala";
      }

      likertGrid.innerHTML = "";
      for (let v = min; v <= max; v++) {
        const btn = document.createElement("button");
        btn.className = "likert-btn";
        btn.textContent = String(v);
        btn.onclick = () => voteLikert(v);
        likertGrid.appendChild(btn);
      }
    }

    function setupOpen() {
      const q = activeQuestion || {};
      const maxChars = Number.isFinite(Number(q.openMaxChars)) ? Number(q.openMaxChars) : CONFIG.LIMITS.OPEN_MAX_CHARS;

      if (openLabel) openLabel.textContent = q.openLabel || "Skriv et kort svar";
      if (openText) openText.maxLength = maxChars;

      if (openCounter && openText) {
        const update = () => {
          const n = (openText.value || "").length;
          openCounter.textContent = `${n}/${maxChars}`;
        };
        openText.oninput = update;
        update();
      }

      if (openSendBtn) {
        openSendBtn.disabled = false;
      }
    }

    function setupWordcloud() {
      const q = activeQuestion || {};
      const maxWords = Number.isFinite(Number(q.wordcloudMaxWords)) ? Number(q.wordcloudMaxWords) : 3;
      const maxCharsPerWord = Number.isFinite(Number(q.wordcloudMaxCharsPerWord)) ? Number(q.wordcloudMaxCharsPerWord) : 20;

      if (wcLabel) wcLabel.textContent = q.wordcloudLabel || "Skriv inntil 3 ord";

      wcInputs.innerHTML = "";
      Array.from({ length: maxWords }).forEach((_, i) => {
        const el = document.createElement("input");
        el.type = "text";
        el.className = "input";
        el.maxLength = maxCharsPerWord;
        el.value = "";
        el.placeholder =
          i === 0 ? "Ord 1"
          : i === 1 ? "Ord 2 (valgfritt)"
          : "Ord 3 (valgfritt)";
        wcInputs.appendChild(el);
      });
    }

    function normalizeStatus(d) {
      const s = (d && d.status) ? String(d.status) : "";
      if (s === "idle" || s === "collect" || s === "results" || s === "paused") return s;

      // Bakoverkompat
      if (d && d.showResults === true) return "results";
      if (d && d.mode) return "collect";
      return "idle";
    }

    async function forceResync(reason) {
      try {
        if (stateUnsub) { try { stateUnsub(); } catch(_) {} stateUnsub = null; }
        await stateRef.get();
      } catch (_) {}
      attachStateListener();
    }

    function attachStateListener() {
      if (stateUnsub) { try { stateUnsub(); } catch(_) {} stateUnsub = null; }

      stateUnsub = stateRef.onSnapshot(doc => {
        if (!doc.exists) return;
        const d = doc.data() || {};

        lastStateUpdateMs = Date.now();

        const newMode = d.mode ?? null;
        const newRound = d.round ?? null;
        const newRoundId = d.roundId ?? (Number.isFinite(newRound) ? ("round_" + newRound) : null);
        const newStatus = normalizeStatus(d);

        // NY
        const newQuestion = d.question || null;

        const changed = (newMode !== mode || newRound !== round || newStatus !== status);

        mode = newMode;
        round = newRound;
        roundId = newRoundId;
        status = newStatus;
        activeQuestion = newQuestion;

        if (changed) {
          hasVoted = false;
          resetUI();
        }

        setTitle();

        render();
        applyPresenterGate();
      });
    }

    attachStateListener();

    // Mobil resync / reconnect
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) forceResync("visibilitychange");
    });

    // Watchdog
    setInterval(() => {
      const now = Date.now();
      if (!lastStateUpdateMs) return;
      if ((now - lastStateUpdateMs) > 10000) forceResync("watchdog");
    }, 1000);

    function render() {
      hideAll();
      setTitle();

      // Debug-UI: entydige labels
      const label =
        (status === "idle")   ? "IDLE – før start (Vi er straks i gang!)" :
        (status === "collect") ? "COLLECT – aktiv innsamling (Svar samles inn!)" :
        (status === "results") ? "RESULTS – viser resultater" :
        "PAUSED – bytter spørsmål/modus (mellomtilstand)";

      if (!presenterOk() || status === "idle" || status === "paused" || status === "results" || !mode) {
        waitingBox.classList.remove("hidden");
        waitingBox.textContent = label;
        if (!hasVoted) setMsg("");
        return;
      }

      // status === "collect" og foreleser er "alive"
      waitingBox.classList.add("hidden");
      if (!hasVoted) setMsg("");

      if (mode === CONFIG.MODES.OPEN) {
        openBox.classList.remove("hidden");
        setupOpen();
        return;
      }

      if (mode === CONFIG.MODES.WORDCLOUD) {
        wcBox.classList.remove("hidden");
        setupWordcloud();
        return;
      }

      if (mode === CONFIG.MODES.LIKERT) {
        likertBox.classList.remove("hidden");
        buildLikertGrid();
        return;
      }

      // MULTI (inkl presets + opplegg)
      multiBox.classList.remove("hidden");
      renderDynamicMulti();
    }

    async function voteDynamic(optId) {
      if (hasVoted) return;
      hasVoted = true;

      try {
        const path = "counts." + String(optId);
        await pollRef.set({ [path]: firebase.firestore.FieldValue.increment(1) }, { merge: true });
        setMsg("Takk! ✅");
      } catch (e) {
        hasVoted = false;
        setMsg("Feil. Prøv igjen.");
      }
    }

    async function voteLikert(v) {
      if (hasVoted) return;

      hasVoted = true;
      freezeVotedUI(true);

      try {
        await pollRef.set({
          likertSum: firebase.firestore.FieldValue.increment(Number(v) || 0),
          likertCount: firebase.firestore.FieldValue.increment(1)
        }, { merge: true });

        setMsg("Takk! ✅");
      } catch (e) {
        hasVoted = false;
        freezeVotedUI(false);
        setMsg("Feil. Prøv igjen.");
      }
    }

    async function sendOpen() {
      if (hasVoted) return;

      const text = (openText.value || "").trim();
      const q = activeQuestion || {};
      const maxChars = Number.isFinite(Number(q.openMaxChars)) ? Number(q.openMaxChars) : CONFIG.LIMITS.OPEN_MAX_CHARS;

      if (!text) return;

      hasVoted = true;
      freezeVotedUI(true);

      try {
        const rid = roundId || ("round_" + (round ?? 0));
        await db.collection(CONFIG.FIRESTORE.OPEN_COLLECTION)
          .doc(rid)
          .collection("answers")
          .add({
            text: text.slice(0, maxChars),
            ts: firebase.firestore.FieldValue.serverTimestamp()
          });

        setMsg("Takk! ✅");
      } catch (e) {
        hasVoted = false;
        freezeVotedUI(false);
        setMsg("Feil. Prøv igjen.");
      }
    }

    async function sendWordcloud() {
      if (hasVoted) return;

      const words = Array.from(wcInputs.querySelectorAll("input"))
        .map(i => (i.value || "").trim())
        .filter(Boolean);

      if (!words.length) return;

      hasVoted = true;
      freezeVotedUI(true);

      try {
        const rid = roundId || ("round_" + (round ?? 0));
        await db.collection(CONFIG.FIRESTORE.WORDCLOUD_COLLECTION)
          .doc(rid)
          .collection("answers")
          .add({
            words,
            ts: firebase.firestore.FieldValue.serverTimestamp()
          });

        setMsg("Takk! ✅");
      } catch (e) {
        hasVoted = false;
        freezeVotedUI(false);
        setMsg("Feil. Prøv igjen.");
      }
    }

    function freezeVotedUI(isFrozen) {
      // behold eksisterende enkel gating
      const btns = document.querySelectorAll("button, input, textarea");
      btns.forEach(b => {
        if (b.id === "openText") return;
        if (typeof b.disabled === "boolean") b.disabled = !!isFrozen;
      });

      if (openText) openText.disabled = !!isFrozen;
    }

    function escapeHtml(s) {
      return (s || "")
        .toString()
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
    function escapeAttr(s) { return escapeHtml(s).replaceAll("\n", " "); }
  </script>
</body>
</html>
