<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>Stem her</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: system-ui, sans-serif;
      text-align: center;
      padding: 2rem;
    }

    h1 {
      margin-bottom: 1.5rem;
    }

    button {
      font-size: 1.4rem;
      padding: 1.2rem 2rem;
      margin: 1rem;
      width: 80%;
      max-width: 320px;

      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;

      /* VIKTIG: eksplisitt bakgrunn */
      background: #f3f3f3;

      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    button:hover {
      background-color: #e0e0e0;
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
      transform: none;
    }

    .green  { background:#2e7d32; color:white; }
    .yellow { background:#f9a825; color:#222; }
    .red    { background:#c62828; color:white; }

    .green:hover  { background:#256a2a; }
    .yellow:hover { background:#e0a71f; }
    .red:hover    { background:#a61f1f; }

    .hidden {
      display: none;
    }

    #msg {
      margin-top: 2rem;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .waiting {
      color:#1565c0;
    }

    .done {
      color:#2e7d32;
    }
  </style>
</head>

<body>

<h1 id="title">Vent litt …</h1>

<!-- Ventemelding -->
<div id="waitingBox" class="waiting">
  Foreleser starter snart 🙂
</div>

<!-- SBS -->
<div id="sbsBox" class="hidden">
  <button class="green"  onclick="vote('A')">Sunn</button><br>
  <button class="yellow" onclick="vote('B')">Bekymringsfull</button><br>
  <button class="red"    onclick="vote('C')">Skadelig</button>
</div>

<!-- BNR -->
<div id="bnrBox" class="hidden">
  <button class="green"  onclick="vote('A')">Beskyttende</button><br>
  <button class="yellow" onclick="vote('B')">Nøytral</button><br>
  <button class="red"    onclick="vote('C')">Risiko</button>
</div>

<!-- JA / NEI -->
<div id="jnBox" class="hidden">
  <button class="green" onclick="vote('A')">Ja</button><br>
  <button class="red"   onclick="vote('B')">Nei</button>
</div>

<p id="msg" class="waiting"></p>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBtjn54Bz0Mjeh43hanythhbAhPBna7-Eg",
    authDomain: "profesor-7e112.firebaseapp.com",
    projectId: "profesor-7e112",
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const pollRef  = db.collection("polls").doc("livePoll");
  const stateRef = db.collection("app").doc("state");

  let hasVoted = false;
  let mode  = null;
  let round = null;

  stateRef.onSnapshot(doc => {
    if (!doc.exists) return;

    const newMode  = doc.data().mode  ?? null;
    const newRound = doc.data().round ?? null;

    if (newMode !== mode || newRound !== round) {
      mode  = newMode;
      round = newRound;

      hasVoted = false;
      enableAllButtons();
      showWaitingMessage();
      render();
    }
  });

  function render() {
    hideAll();

    if (!mode) {
      setTitle("Vent litt …");
      show("waitingBox");
      return;
    }

    setTitle("Velg svar");

    if (mode === "sbs")   { show("sbsBox"); return; }
    if (mode === "bnr")   { show("bnrBox"); return; }
    if (mode === "yesno") { show("jnBox");  return; }

    show("waitingBox");
  }

  async function vote(option) {
    if (hasVoted) return;

    try {
      await pollRef.set(
        { [option]: firebase.firestore.FieldValue.increment(1) },
        { merge: true }
      );

      hasVoted = true;
      document.getElementById("msg").textContent = "Takk, svaret er avgitt!";
      document.getElementById("msg").className = "done";
      disableAllButtons();

    } catch (err) {
      document.getElementById("msg").textContent =
        "Noe gikk galt – prøv igjen";
      document.getElementById("msg").className = "waiting";
    }
  }

  function showWaitingMessage() {
    const msg = document.getElementById("msg");
    msg.textContent = "Venter på svar …";
    msg.className = "waiting";
  }

  function hideAll() {
    hide("waitingBox");
    hide("sbsBox");
    hide("bnrBox");
    hide("jnBox");
  }

  function disableAllButtons() {
    document.querySelectorAll("button").forEach(b => b.disabled = true);
  }

  function enableAllButtons() {
    document.querySelectorAll("button").forEach(b => b.disabled = false);
  }

  function show(id) {
    document.getElementById(id).style.display = "block";
  }

  function hide(id) {
    document.getElementById(id).style.display = "none";
  }

  function setTitle(text) {
    document.getElementById("title").textContent = text;
  }
</script>

</body>
</html>
