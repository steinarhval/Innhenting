<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>Stem her</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
 <style>
  body {
    font-family: system-ui, sans-serif;
    text-align: center;
    padding: 2rem;
  }

  button {
    font-size: 1.5rem;
    padding: 1.2rem 2rem;
    margin: 1rem;
    width: 80%;
    max-width: 300px;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
  }

  .green {
    background-color: #2e7d32;
    color: white;
  }

  .yellow {
    background-color: #f9a825;
    color: #222;
  }

  .red {
    background-color: #c62828;
    color: white;
  }
#msg {
  margin-top: 2rem;
  font-size: 1.1rem;
  font-weight: 600;
}

.msg-waiting {
  color: #1565c0; /* blå */
}

.msg-done {
  color: #2e7d32; /* grønn */
}


  button:active {
    transform: scale(0.98);
  }
</style>

</head>
<body>

<h1>Velg svar</h1>

<button class="green" onclick="vote('A')">Beskyttende</button><br>
<button class="yellow" onclick="vote('B')">Nøytral</button><br>
<button class="red" onclick="vote('C')">Risiko</button>

<p id="msg" class="msg-waiting">Venter på svar når du er klar.</p>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBtjn54Bz0Mjeh43hanythhbAhPBna7-Eg",
    authDomain: "profesor-7e112.firebaseapp.com",
    projectId: "profesor-7e112",
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const pollRef = db.collection("polls").doc("livePoll");

  function vote(option) {
  pollRef.update({
    [option]: firebase.firestore.FieldValue.increment(1)
  });

  const msg = document.getElementById("msg");
  msg.textContent = "Takk, svaret er avgitt!";
  msg.classList.remove("msg-waiting");
  msg.classList.add("msg-done");

  document.querySelectorAll("button").forEach(btn => {
    btn.disabled = true;
    btn.style.opacity = 0.6;
  });
}
pollRef.onSnapshot(doc => {
  const d = doc.data();
  const total = (d.A || 0) + (d.B || 0) + (d.C || 0);

  // Ny runde: alle verdier er null
  if (total === 0) {
    const msg = document.getElementById("msg");

    msg.textContent = "Venter på svar når du er klar.";
    msg.classList.remove("msg-done");
    msg.classList.add("msg-waiting");

    document.querySelectorAll("button").forEach(btn => {
      btn.disabled = false;
      btn.style.opacity = 1;
    });
  }
});

</script>

</body>
</html>
