<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <title>Rediger undervisningsopplegg</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="theme.css">

  <!-- Robust wrap/padding (hvis theme.css mangler disse reglene i din nåværende versjon) -->
  <style>
    body.program-edit .wrap{
      max-width: min(1200px, 96vw);
      margin: 0 auto;
      padding: clamp(16px, 3vw, 32px);
      padding-bottom: calc(clamp(16px, 3vw, 32px) + 24px);
    }

    /* Accordion styling (matcher card-look) */
    details.qAcc{
      background: var(--color-surface);
      border: 1px solid var(--color-card-border);
      border-radius: 14px;
      box-shadow: var(--shadow-1);
      margin: 0.7rem 0;
      overflow: hidden;
    }
    details.qAcc > summary{
      list-style: none;
      cursor: pointer;
      padding: 0.95rem 1rem;
      display: flex;
      gap: 10px;
      align-items: baseline;
      user-select: none;
    }
    details.qAcc > summary::-webkit-details-marker{ display:none; }

    .qAccNum{
      font-weight: 950;
      opacity: 0.75;
      white-space: nowrap;
    }
    .qAccTitle{
      font-weight: 950;
      line-height: 1.2;
    }

    .qAccBody{
      padding: 0 1rem 1rem;
    }

    /* Litt tydelighet på hover */
    details.qAcc > summary:hover{
      background: color-mix(in srgb, var(--color-ui-100) 70%, transparent 30%);
    }

    /* Når lukket: kutt bort body-paddingen (så det ser “kompakt” ut) */
    details.qAcc:not([open]) .qAccBody{ display:none; }
  </style>
</head>

<body class="program-edit">
  <div class="wrap">
    <div class="top">
      <div>
        <h1 id="pageTitle">Rediger opplegg</h1>
        <p class="mutedline" id="metaLine">Laster…</p>
      </div>

      <div class="row topLinks">
        <a class="btn btn--ghost" href="opplegg.html">Til liste</a>
        <a class="btn btn--ghost" href="hovedmeny.html">Hovedmeny</a>
      </div>
    </div>

    <div class="card">
      <div class="sectionTitle">Navn på opplegg</div>
      <div class="row">
        <div class="titleBlock">
          <input id="programTitle" class="input" type="text" placeholder="Navn" />
          <div class="help">Tips: hold det kort. Du skal finne det igjen om 2 år.</div>
        </div>
        <button class="btn btn--success" onclick="saveNow()">Lagre</button>
      </div>
    </div>

    <div class="card">
      <div class="row qCardRow">
        <div>
          <div class="sectionTitle sectionTitle--tight">Spørsmål</div>
          <div class="help">Legg til, flytt, rediger. Alt lagres på “Lagre”.</div>
        </div>
        <button class="btn btn--success" onclick="addQuestion()">+ Legg til spørsmål</button>
      </div>
    </div>

    <div id="questions"></div>

    <div class="stickyBar">
      <button class="btn btn--ghost" onclick="reloadDoc()">Angre endringer (last på nytt)</button>
      <button class="btn btn--success" onclick="saveNow()">Lagre</button>
    </div>

    <div id="errorBox" class="error"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="config.js"></script>

  <script>
    const db = FirebaseUtil.initFirebaseOnce();
    const programsRef = db.collection("teachingPrograms");

    const params = new URLSearchParams(window.location.search);
    const programId = params.get("id");

    if (!programId) {
      showError("Mangler ?id=... i URL.");
      throw new Error("Missing program id");
    }

    let docData = null;
    let working = null;

    // Hvilket spørsmål er "aktivt" (åpent) i accordion
    let activeIdx = 0;

    // Presets: hent fra theme.css (SBS) + nøytrale defaults
    const PRESET_TRAFFIC = [
      cssVar("--sbs-green"),
      cssVar("--sbs-yellow"),
      cssVar("--sbs-red")
    ];

    const PRESET_BLUE = ["#0D47A1", "#1565C0", "#64B5F6"];

    const PRESET_GRAY = [
      cssVar("--color-text-main"),
      cssVar("--color-text-muted"),
      cssVar("--color-ui-300")
    ];

    const YES_COLOR = cssVar("--color-success") || "#2E7D32";
    const NO_COLOR  = cssVar("--color-danger")  || "#C62828";

    const MODE_LABELS = {
      multi: "Knapper (valgfritt antall)",
      yesno: "Ja / Nei",
      likert: "Likert (0–10)",
      open: "Åpent svar (tekst)",
      wordcloud: "Ordsky (1–3 ord)"
    };

    reloadDoc();

    async function reloadDoc() {
      hideError();
      try {
        const snap = await programsRef.doc(programId).get();
        if (!snap.exists) {
          showError("Opplegget finnes ikke (eller er slettet hardt).");
          return;
        }
        docData = { id: snap.id, ...snap.data() };
        working = deepClone(docData);

        if (!Array.isArray(working.questions)) working.questions = [];
        working.questions = normalizeQuestions(working.questions);

        // Hvis det finnes spørsmål: sørg for gyldig aktiv idx
        activeIdx = Math.max(0, Math.min(activeIdx, working.questions.length - 1));

        render();
      } catch (err) {
        showError("Kunne ikke laste opplegg:\n" + err.message);
      }
    }

    function normalizeQuestions(qs) {
      const out = qs.map((q, idx) => {
        const qq = q || {};
        const id = qq.id || ("q" + Date.now() + "_" + Math.random().toString(16).slice(2));
        const order = Number.isFinite(qq.order) ? qq.order : (idx + 1);

        let mode = qq.mode || "multi";
        if (!MODE_LABELS[mode]) mode = "multi";

        let options = Array.isArray(qq.options) ? qq.options : null;

        if (mode === "yesno") {
          options = [
            { id:"a", label:"Ja",  color: YES_COLOR },
            { id:"b", label:"Nei", color: NO_COLOR }
          ];
        }

        if (mode === "multi") {
          if (!options || options.length < 2) {
            options = [
              { id:"a", label:"A", color: PRESET_TRAFFIC[0] },
              { id:"b", label:"B", color: PRESET_TRAFFIC[1] },
              { id:"c", label:"C", color: PRESET_TRAFFIC[2] }
            ];
          } else {
            options = options.map((o, i) => ({
              id: (o && o.id) ? o.id : ("o" + i),
              label: (o && o.label) ? o.label : ("Valg " + (i+1)),
              color: (o && o.color) ? o.color : (cssVar("--color-ui-300") || "#DDDDDD")
            }));
          }
        }

        return {
          id,
          order,
          title: qq.title || ("Spørsmål " + order),
          mode,
          options
        };
      });

      out.sort((a,b) => a.order - b.order);
      out.forEach((q, i) => q.order = i + 1);
      return out;
    }

    function render() {
      document.getElementById("programTitle").value = working.title || "";
      document.getElementById("metaLine").textContent =
        (working.isDeleted ? "🗑️ (Slettet) · " : "") +
        (working.questions.length + " spørsmål");

      renderQuestions();
      applyDynamicPills();
      setupAccordion();
    }

    function renderQuestions() {
      const host = document.getElementById("questions");
      if (!working.questions.length) {
        host.innerHTML = `<div class="card"><div class="muted">Ingen spørsmål ennå. Trykk “Legg til spørsmål”.</div></div>`;
        return;
      }

      // Sikre at activeIdx alltid er gyldig
      activeIdx = Math.max(0, Math.min(activeIdx, working.questions.length - 1));

      host.innerHTML = working.questions.map((q, idx) => {
        const openAttr = (idx === activeIdx) ? "open" : "";
        const titleTxt = (q.title || ("Spørsmål " + (idx+1))).trim();

        return `
          <details class="qAcc" data-idx="${idx}" ${openAttr}>
            <summary>
              <span class="qAccNum">#${idx+1}</span>
              <span class="qAccTitle" id="qSummaryText_${idx}">${escapeHtml(titleTxt)}</span>
            </summary>

            <div class="qAccBody">
              <div class="qHeader qCardRow">
                <div>
                  <div class="sectionTitle sectionTitle--tight">Handlinger</div>
                </div>
                <div class="qTools">
                  <button class="btn btn--ghost" onclick="moveUp(${idx})" ${idx===0 ? "disabled" : ""}>↑</button>
                  <button class="btn btn--ghost" onclick="moveDown(${idx})" ${idx===working.questions.length-1 ? "disabled" : ""}>↓</button>
                  <button class="btn btn--ghost" onclick="duplicateQuestion(${idx})">Dupliser</button>
                  <button class="btn btn--danger" onclick="deleteQuestion(${idx})">Slett</button>
                </div>
              </div>

              <div class="hr"></div>

              <div class="grid2">
                <div>
                  <div class="sectionTitle sectionTitle--tight">Spørsmål</div>
                  <input
                    class="input"
                    type="text"
                    value="${escapeAttr(q.title || "")}"
                    oninput="setQTitle(${idx}, this.value)"
                    placeholder="Skriv spørsmålet…"
                  />

                  <div class="sectionTitle">Modus</div>
                  <div class="row modeRow">
                    <select onchange="setQMode(${idx}, this.value)">
                      ${Object.keys(MODE_LABELS).map(m => `<option value="${m}" ${m===q.mode?"selected":""}>${escapeHtml(MODE_LABELS[m])}</option>`).join("")}
                    </select>
                  </div>

                  ${renderModeEditor(idx, q)}
                </div>

                <div>
                  <div class="sectionTitle sectionTitle--tight">Forhåndsvisning</div>
                  <div id="preview_${idx}">
                    ${renderPreview(q, idx)}
                  </div>
                  <div class="help">Tekstfarge settes automatisk (svart/hvit) basert på bakgrunn.</div>
                </div>
              </div>
            </div>
          </details>
        `;
      }).join("");
    }

    // Accordion: åpne én – lukk resten. Oppdater activeIdx.
    function setupAccordion() {
      const items = Array.from(document.querySelectorAll("details.qAcc"));

      items.forEach(d => {
        d.addEventListener("toggle", () => {
          if (!d.open) return;

          const idx = Number(d.getAttribute("data-idx"));
          if (Number.isFinite(idx)) activeIdx = idx;

          items.forEach(other => {
            if (other !== d) other.open = false;
          });
        });
      });

      // Sikkerhetsnett: sørg for at minst ett er åpent
      if (items.length && !items.some(x => x.open)) {
        items[Math.max(0, Math.min(activeIdx, items.length - 1))].open = true;
      }
    }

    function renderModeEditor(idx, q) {
      if (q.mode === "likert") return `<div class="help help--spaced">Likert er fast 0–10 (ingen alternativer å sette).</div>`;
      if (q.mode === "open") return `<div class="help help--spaced">Åpent svar bruker tekstfelt.</div>`;
      if (q.mode === "wordcloud") return `<div class="help help--spaced">Ordsky er 1–3 ord.</div>`;

      const canAddRemove = (q.mode === "multi");

      const presetButtons = (q.options && q.options.length === 3) ? `
        <div class="row presetRow">
          <button class="btn btn--ghost" onclick="applyPreset(${idx}, 'traffic')">Trafikklys</button>
          <button class="btn btn--ghost" onclick="applyPreset(${idx}, 'blue')">Blå</button>
          <button class="btn btn--ghost" onclick="applyPreset(${idx}, 'gray')">Grå</button>
        </div>
        <div class="help">Presets virker best når du har 3 alternativer.</div>
      ` : `<div class="help">Presets (trafikklys/blå/grå) er mest nyttig ved 3 alternativer.</div>`;

      return `
        <div class="sectionTitle">Svaralternativer</div>
        <div class="help">Label + farge per alternativ.</div>

        <div class="optionsWrap">
          ${(q.options || []).map((o, oi) => {
            const bg = normalizeHex(o.color) || (cssVar("--color-ui-300") || "#DDDDDD");
            return `
              <div class="optRow">
                <input
                  class="input optInput"
                  type="text"
                  value="${escapeAttr(o.label || "")}"
                  oninput="setOptLabel(${idx}, ${oi}, this.value)"
                  placeholder="Label"
                />
                <input type="color" value="${escapeAttr(bg)}" onchange="setOptColor(${idx}, ${oi}, this.value)" />
                <div
                  id="pill_${idx}_${oi}"
                  class="pill pill--dyn"
                  data-bg="${escapeAttr(bg)}"
                >${escapeHtml(o.label || "Valg")}</div>
                ${canAddRemove ? `<button class="btn btn--danger" onclick="removeOption(${idx}, ${oi})">–</button>` : `<div></div>`}
              </div>
            `;
          }).join("")}

          ${canAddRemove ? `
            <div class="row addOptRow">
              <button class="btn btn--success" onclick="addOption(${idx})">+ Legg til alternativ</button>
              <span class="help">Anbefalt maks: 7 (mobil).</span>
            </div>
          ` : `<div class="help help--spaced">Ja/Nei er låst til 2 alternativer i editoren.</div>`}
        </div>

        ${presetButtons}
      `;
    }

    function renderPreview(q, idx) {
      if (q.mode === "likert") {
        return `
          <div class="pill previewPill previewPill--neutral">0 … 10</div>
          <div class="help previewHelp">Resultatvisning blir som før.</div>
        `;
      }
      if (q.mode === "open") return `<div class="pill previewPill previewPill--neutral">[ Tekstfelt ]</div>`;
      if (q.mode === "wordcloud") return `<div class="pill previewPill previewPill--neutral">[ 1–3 ord ]</div>`;

      const opts = q.options || [];
      return opts.map((o, oi) => {
        const bg = normalizeHex(o.color) || (cssVar("--color-ui-300") || "#DDDDDD");
        return `<div id="prevpill_${idx}_${oi}" class="pill previewPill pill--dyn" data-bg="${escapeAttr(bg)}">${escapeHtml(o.label || "")}</div>`;
      }).join("");
    }

    function applyDynamicPills() {
      document.querySelectorAll(".pill--dyn").forEach(el => {
        const bg = (el.getAttribute("data-bg") || "").trim();
        const ok = normalizeHex(bg);
        const use = ok || (cssVar("--color-ui-300") || "#DDDDDD");
        el.style.backgroundColor = use;
        el.style.color = autoTextColor(use);
      });
    }

    function addQuestion() {
      const nextOrder = working.questions.length + 1;
      const q = {
        id: "q" + Date.now() + "_" + Math.random().toString(16).slice(2),
        order: nextOrder,
        title: "Spørsmål " + nextOrder,
        mode: "multi",
        options: [
          { id:"a", label:"A", color: PRESET_TRAFFIC[0] },
          { id:"b", label:"B", color: PRESET_TRAFFIC[1] },
          { id:"c", label:"C", color: PRESET_TRAFFIC[2] },
        ]
      };
      working.questions.push(q);
      working.questions = normalizeQuestions(working.questions);

      // Åpne det nye spørsmålet
      activeIdx = working.questions.length - 1;

      render();
    }

    function duplicateQuestion(idx) {
      const src = working.questions[idx];
      const copy = deepClone(src);
      copy.id = "q" + Date.now() + "_" + Math.random().toString(16).slice(2);
      if (Array.isArray(copy.options)) {
        copy.options = copy.options.map((o, i) => ({
          ...o,
          id: "o" + Date.now() + "_" + i + "_" + Math.random().toString(16).slice(2)
        }));
      }
      working.questions.splice(idx + 1, 0, copy);
      working.questions = normalizeQuestions(working.questions);

      // Åpne kopien
      activeIdx = Math.min(idx + 1, working.questions.length - 1);

      render();
    }

    function deleteQuestion(idx) {
      if (!confirm("Slette dette spørsmålet?")) return;
      working.questions.splice(idx, 1);
      working.questions = normalizeQuestions(working.questions);

      // Juster activeIdx
      activeIdx = Math.max(0, Math.min(activeIdx, working.questions.length - 1));

      render();
    }

    function moveUp(idx) {
      if (idx <= 0) return;
      const a = working.questions[idx-1];
      const b = working.questions[idx];
      const tmp = a.order;
      a.order = b.order;
      b.order = tmp;
      working.questions = normalizeQuestions(working.questions);

      if (activeIdx === idx) activeIdx = idx - 1;
      else if (activeIdx === idx - 1) activeIdx = idx;

      render();
    }

    function moveDown(idx) {
      if (idx >= working.questions.length-1) return;
      const a = working.questions[idx];
      const b = working.questions[idx+1];
      const tmp = a.order;
      a.order = b.order;
      b.order = tmp;
      working.questions = normalizeQuestions(working.questions);

      if (activeIdx === idx) activeIdx = idx + 1;
      else if (activeIdx === idx + 1) activeIdx = idx;

      render();
    }

    function setQTitle(idx, title) {
      working.questions[idx].title = (title || "");
      const newTxt = working.questions[idx].title || ("Spørsmål " + (idx + 1));

      // Oppdater kun summary (ikke intern tittel – den finnes ikke lenger)
      const s = document.getElementById("qSummaryText_" + idx);
      if (s) s.textContent = newTxt;
    }

    function setQMode(idx, mode) {
      if (!MODE_LABELS[mode]) mode = "multi";
      const q = working.questions[idx];
      q.mode = mode;

      if (mode === "yesno") {
        q.options = [
          { id:"a", label:"Ja",  color: YES_COLOR },
          { id:"b", label:"Nei", color: NO_COLOR }
        ];
      } else if (mode === "multi") {
        if (!Array.isArray(q.options) || q.options.length < 2) {
          q.options = [
            { id:"a", label:"A", color: PRESET_TRAFFIC[0] },
            { id:"b", label:"B", color: PRESET_TRAFFIC[1] },
            { id:"c", label:"C", color: PRESET_TRAFFIC[2] }
          ];
        }
      }

      activeIdx = idx;
      render();
    }

    function addOption(qIdx) {
      const q = working.questions[qIdx];
      if (!Array.isArray(q.options)) q.options = [];
      const n = q.options.length + 1;
      q.options.push({
        id: "o" + Date.now(),
        label: "Valg " + n,
        color: (cssVar("--color-ui-300") || "#DDDDDD")
      });

      activeIdx = qIdx;
      render();
    }

    function removeOption(qIdx, optIdx) {
      const q = working.questions[qIdx];
      if (!q.options || q.options.length <= 2) {
        alert("Må ha minst 2 alternativer.");
        return;
      }
      q.options.splice(optIdx, 1);

      activeIdx = qIdx;
      render();
    }

    function setOptLabel(qIdx, optIdx, label) {
      const q = working.questions[qIdx];
      q.options[optIdx].label = (label || "");

      const pill = document.getElementById(`pill_${qIdx}_${optIdx}`);
      if (pill) pill.textContent = q.options[optIdx].label || "Valg";

      const prev = document.getElementById(`prevpill_${qIdx}_${optIdx}`);
      if (prev) prev.textContent = q.options[optIdx].label || "";
    }

    function setOptColor(qIdx, optIdx, color) {
      const q = working.questions[qIdx];
      const bg = normalizeHex(color) || (cssVar("--color-ui-300") || "#DDDDDD");
      q.options[optIdx].color = bg;

      activeIdx = qIdx;
      render();
    }

    function applyPreset(qIdx, which) {
      const q = working.questions[qIdx];
      if (!q.options || q.options.length !== 3) return;

      const preset = (which === "blue") ? PRESET_BLUE : (which === "gray" ? PRESET_GRAY : PRESET_TRAFFIC);
      q.options.forEach((o, i) => o.color = preset[i] || o.color);

      activeIdx = qIdx;
      render();
    }

    async function saveNow() {
      hideError();

      const title = (document.getElementById("programTitle").value || "").trim();
      if (!title) { showError("Opplegget må ha et navn."); return; }

      for (const q of working.questions) {
        if (!q.title || !q.title.trim()) { showError("Et spørsmål mangler tekst."); return; }
        if ((q.mode === "multi" || q.mode === "yesno") && (!q.options || q.options.length < 2)) {
          showError("Et spørsmål med knapper må ha minst 2 alternativer."); return;
        }
        if (q.options && q.options.some(o => !o.label || !o.label.trim())) {
          showError("Et svaralternativ mangler label."); return;
        }
      }

      working.title = title;
      working.questions = normalizeQuestions(working.questions);

      const payload = {
        title: working.title,
        isDeleted: working.isDeleted === true,
        questions: working.questions,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        await programsRef.doc(programId).set(payload, { merge: true });
        await reloadDoc();
      } catch (err) {
        showError("Kunne ikke lagre:\n" + err.message);
      }
    }

    function deepClone(x) { return JSON.parse(JSON.stringify(x)); }

    function normalizeHex(color) {
      if (!color) return "";
      const s = color.toString().trim();
      if (/^#[0-9a-fA-F]{6}$/.test(s)) return s;
      if (/^[0-9a-fA-F]{6}$/.test(s)) return "#" + s;
      return "";
    }

    function autoTextColor(bgHex) {
      const hex = (bgHex || "").replace("#", "");
      if (hex.length !== 6) return "#000";
      const r = parseInt(hex.slice(0,2), 16);
      const g = parseInt(hex.slice(2,4), 16);
      const b = parseInt(hex.slice(4,6), 16);
      const y = (0.2126*r + 0.7152*g + 0.0722*b);
      return (y < 140) ? "white" : "#000";
    }

    function escapeHtml(s) {
      return (s || "")
        .toString()
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
    function escapeAttr(s) { return escapeHtml(s).replaceAll("\n", " "); }

    function showError(text) {
      const box = document.getElementById("errorBox");
      box.style.display = "block";
      box.textContent = text;
    }
    function hideError() {
      const box = document.getElementById("errorBox");
      box.style.display = "none";
      box.textContent = "";
    }

    function cssVar(name) {
      const v = getComputedStyle(document.documentElement).getPropertyValue(name);
      return (v && v.trim()) ? v.trim() : "";
    }
  </script>
</body>
</html>
