<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <title>Ordsamling</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      text-align: center;
      padding: 2rem;
      max-width: 520px;
      margin: 0 auto;
    }

    h1 { margin-bottom: 1.5rem; }

    .wrap {
      display: grid;
      gap: 0.9rem;
      margin: 1rem 0 1.2rem 0;
    }

    input {
      font-size: 1.15rem;
      padding: 0.9rem 1rem;
      border: 1px solid #ccc;
      border-radius: 10px;
      outline: none;
    }

    input:focus { border-color: #1565c0; }

    button {
      font-size: 1.2rem;
      padding: 1rem 1.4rem;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      max-width: 520px;
    }

    .btn-send {
      background: #1565c0;
      color: white;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #msg {
      margin-top: 1.4rem;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .msg-waiting { color: #1565c0; }
    .msg-done { color: #2e7d32; }
    .msg-error { color: #c62828; }

    .hint {
      font-size: 0.95rem;
      color: #444;
      margin-top: 0.5rem;
      line-height: 1.35;
    }
  </style>
</head>
<body>

  <h1>Skriv inntil 3 ord</h1>

  <div class="wrap">
    <input id="w1" maxlength="30" placeholder="Ord 1 (maks 30 tegn)" />
    <input id="w2" maxlength="30" placeholder="Ord 2 (valgfritt)" />
    <input id="w3" maxlength="30" placeholder="Ord 3 (valgfritt)" />
  </div>

  <button class="btn-send" id="sendBtn" onclick="submitWords()">Send inn</button>

  <div class="hint">
    Tips: Ett ord per felt. Du kan sende inn 1, 2 eller 3 ord.
  </div>

  <p id="msg" class="msg-waiting">Venter på svar når du er klar.</p>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBtjn54Bz0Mjeh43hanythhbAhPBna7-Eg",
      authDomain: "profesor-7e112.firebaseapp.com",
      projectId: "profesor-7e112",
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Egen poll for wordcloud
    const pollRef = db.collection("polls").doc("cloudPoll");

    let lastRoundSeen = null;

    function setMsg(text, cls) {
      const msg = document.getElementById("msg");
      msg.textContent = text;
      msg.className = cls;
    }

    function setInputsEnabled(enabled) {
      ["w1","w2","w3"].forEach(id => {
        const el = document.getElementById(id);
        el.disabled = !enabled;
      });
      const btn = document.getElementById("sendBtn");
      btn.disabled = !enabled;
      btn.style.opacity = enabled ? 1 : 0.6;
    }

    function clearInputs() {
      ["w1","w2","w3"].forEach(id => document.getElementById(id).value = "");
    }

    function normalizeWord(raw) {
      if (!raw) return "";
      let w = raw.trim().toLowerCase();

      // enkel sperre mot tomme / bare symboler
      w = w.replace(/\s+/g, " ");
      w = w.replace(/^[^a-zæøå0-9]+|[^a-zæøå0-9]+$/gi, ""); // trim ikke-ord i kantene
      if (!w) return "";

      // maks 30 tegn (HTML maxlength tar det meste, men vi sikrer)
      w = w.slice(0, 30);

      // En veldig enkel "norsk-ish" stemming:
      // prøver å slå sammen typiske bøyninger: trygg/trygge/trygger osv.
      w = stemNo(w);

      return w;
    }

    function stemNo(word) {
      // behold korte ord
      if (word.length <= 3) return word;

      // fjern noen vanlige endelser (best-effort)
      const suffixes = [
        "ene","ende","ande","erne","erende","hetene","heten","heten",
        "ingene","ingen","inger","inga","ing",
        "else","elsen","elser",
        "heten","hetene",
        "ende","ane",
        "ene","er","en","et","a","e","s"
      ];

      // fjern bare én gang, lengste først (forutsigbarhet)
      suffixes.sort((a,b) => b.length - a.length);
      for (const suf of suffixes) {
        if (word.length > suf.length + 2 && word.endsWith(suf)) {
          return word.slice(0, -suf.length);
        }
      }
      return word;
    }

    function safeFieldKey(word) {
      // Firestore map keys kan ikke inneholde '.' i dot-notation updates.
      // Vi gjør en trygg nøkkel: kun bokstaver/tall/æøå/_-
      return word
        .replace(/\./g, "_")
        .replace(/[^a-zæøå0-9_-]/gi, "_")
        .slice(0, 40);
    }

    async function submitWords() {
      const raw = [
        document.getElementById("w1").value,
        document.getElementById("w2").value,
        document.getElementById("w3").value
      ];

      const words = raw
        .map(normalizeWord)
        .filter(Boolean);

      // enkel sperre
      if (words.length === 0) {
        setMsg("Skriv minst ett ord før du sender inn.", "msg-error");
        return;
      }

      // Lås UI
      setInputsEnabled(false);

      try {
        // Oppdater doc atomisk: increment på words.<key> og total
        const updateObj = {
          total: firebase.firestore.FieldValue.increment(words.length)
        };

        words.forEach(w => {
          const key = safeFieldKey(w);
          updateObj[`words.${key}`] = firebase.firestore.FieldValue.increment(1);
          // Vi kan også lagre "label" hvis vi vil, men for enkelhet bruker vi nøkkelen som visning.
        });

        await pollRef.set(updateObj, { merge: true });

        setMsg("Takk, svaret er avgitt!", "msg-done");
      } catch (err) {
        console.error(err);
        setMsg("Noe gikk galt. Prøv igjen.", "msg-error");
        setInputsEnabled(true);
      }
    }

    // Lytt på poll for å "vekke" ny runde ved reset
    pollRef.onSnapshot(doc => {
      if (!doc.exists) {
        // hvis doc ikke er laget ennå, hold oss klare
        setMsg("Venter på at avstemmingen starter…", "msg-waiting");
        setInputsEnabled(true);
        return;
      }

      const d = doc.data() || {};
      const round = typeof d.round === "number" ? d.round : 0;

      if (lastRoundSeen === null) {
        lastRoundSeen = round;
        // ved førstegangs load: klar
        setMsg("Venter på svar når du er klar.", "msg-waiting");
        setInputsEnabled(true);
        return;
      }

      // Ny runde oppdaget -> reset UI
      if (round !== lastRoundSeen) {
        lastRoundSeen = round;
        clearInputs();
        setMsg("Venter på svar når du er klar.", "msg-waiting");
        setInputsEnabled(true);
      }
    });
  </script>
</body>
</html>
